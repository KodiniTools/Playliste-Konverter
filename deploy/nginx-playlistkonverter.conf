# =====================================================================
#  PLAYLIST KONVERTER – nginx-Konfiguration
# =====================================================================
# Ersetzt den bisherigen "PLAYLIST CONVERTER"-Abschnitt in
#   /etc/nginx/sites-enabled/kodinitools.com
#
# Frontend bleibt statisch; die API wird jetzt an den Node-Dienst auf
# Port 9015 (pm2: playlistkonverter-server) weitergereicht – NICHT mehr an
# PHP-FPM. Dadurch verfolgt ein dauerhafter Prozess den echten
# ffmpeg-Fortschritt und die Konvertierung bleibt nicht mehr bei ~96 % stehen.
#
# Nach dem Ersetzen:  nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------

# ===== PLAYLIST KONVERTER =====

# --- Frontend (statische Vue-SPA) ---
location /playlistkonverter/ {
    alias /var/www/kodinitools.com/playlistkonverter/;
    try_files $uri $uri/ /playlistkonverter/index.html;
}

# --- API -> Node-Dienst (Port 9015) ---
# Deckt upload, convert, status/<id> und download/<id> ab.
location ^~ /playlistkonverter/api/ {
    # Große Uploads (bis 2 GB) direkt durchreichen, ohne Zwischenpufferung.
    client_max_body_size 2G;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # Konvertierung großer Playlists kann dauern -> lange Timeouts.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    rewrite ^/playlistkonverter/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:9015;
}

# --- Health-Check ---
location = /playlistkonverter/health {
    include /etc/nginx/snippets/kodini-proxy-common.conf;
    proxy_pass http://127.0.0.1:9015/health;
}

# ===== Ende Playlist Konverter =====
