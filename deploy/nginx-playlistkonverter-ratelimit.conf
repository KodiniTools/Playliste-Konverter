# =====================================================================
#  PLAYLIST KONVERTER – Rate-Limit-Zone (http-Kontext)
# =====================================================================
# Nach /etc/nginx/conf.d/playlistkonverter-ratelimit.conf kopieren. Muss VOR
# dem location-Block aus nginx-playlistkonverter.conf geladen sein, der die
# Zone mit "limit_req zone=playlistkonverter_api" nutzt.
#
#   sudo cp deploy/nginx-playlistkonverter-ratelimit.conf /etc/nginx/conf.d/playlistkonverter-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------

# 10 MB Zustand reicht für ~160.000 IPs; 10 Anfragen pro Sekunde und IP.
limit_req_zone $binary_remote_addr zone=playlistkonverter_api:10m rate=10r/s;
