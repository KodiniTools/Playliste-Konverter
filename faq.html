<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Häufig gestellte Fragen zum Playlist Konverter - Audio-Dateien online zusammenfügen.">
  <title>FAQ - Playlist Konverter</title>
  <link rel="stylesheet" href="/fontawesome/css/fontawesome.min.css" />
  <link rel="stylesheet" href="/fontawesome/css/solid.min.css" />
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)" />
  <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
       damit Light-Nutzer keinen dunklen Flash sehen. Das Seitenskript übernimmt danach. -->
  <script>
    try {
      var storedTheme = localStorage.getItem('theme')
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light')
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light')
    }
  </script>
  <!-- KodiniTools-Tokens v2, Supreme und SSI-Partial-Regeln, geteilt mit App und Landing-Seite -->
  <link rel="stylesheet" href="/src/landing/landing.css" />
</head>
<body>
  <!--#include virtual="/partials/nav.html" -->

  <!-- Seiteninhalt in #app: die Partial-Regeln (body > :not(#app)) treffen so nur Nav, Footer, Cookie-Banner -->
  <main id="app" class="landing">
  <!-- Page Navigation -->
  <nav class="page-nav" aria-label="Seitennavigation">
    <div class="nav-container">
      <a href="./" class="home-link" title="Home" aria-label="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
      <div class="nav-links">
        <a href="./faq.html" class="nav-link" aria-current="page" data-i18n="nav.faq">FAQ</a>
        <a href="./funktion.html" class="nav-link" data-i18n="nav.guide">Anleitung</a>
      </div>
    </div>
  </nav>

  <!-- FAQ Hero Section -->
  <section class="faq-hero">
    <h1 class="faq-hero-title" data-i18n="faq.title">Häufig gestellte Fragen</h1>
    <p class="faq-hero-description" data-i18n="faq.description">
      Hier findest du Antworten auf die häufigsten Fragen zum Playlist Konverter.
    </p>
  </section>

  <!-- FAQ Content Section -->
  <section class="faq-content">
    <div class="container container--narrow">
      <div class="faq-list" id="faqList">
        <!-- FAQ items will be populated by JavaScript -->
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <section class="cta">
    <div class="container">
      <div class="cta-box">
        <div class="cta-content">
          <h2 class="cta-title" data-i18n="cta.title">Bereit zum Starten?</h2>
          <p class="cta-description" data-i18n="cta.description">
            Konvertiere jetzt deine Audio-Dateien - kostenlos und ohne Registrierung.
          </p>
          <a href="./app.html" class="btn btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span data-i18n="cta.button">Zur Anwendung</span>
          </a>
        </div>
      </div>
    </div>
  </section>
  </main>

  <!--#include virtual="/partials/footer.html" -->
  <!--#include virtual="/partials/cookie-banner.html" -->

  <script>
    // Translations
    const translations = {
      de: {
        'nav.logo': 'Playlist Konverter',
        'nav.faq': 'FAQ',
        'nav.guide': 'Anleitung',
        'faq.title': 'Häufig gestellte Fragen',
        'faq.description': 'Hier findest du Antworten auf die häufigsten Fragen zum Playlist Konverter.',
        'cta.title': 'Bereit zum Starten?',
        'cta.description': 'Konvertiere jetzt deine Audio-Dateien - kostenlos und ohne Registrierung.',
        'cta.button': 'Zur Anwendung'
      },
      en: {
        'nav.logo': 'Playlist Converter',
        'nav.faq': 'FAQ',
        'nav.guide': 'Guide',
        'faq.title': 'Frequently Asked Questions',
        'faq.description': 'Find answers to the most common questions about the Playlist Converter.',
        'cta.title': 'Ready to Start?',
        'cta.description': 'Convert your audio files now - free and without registration.',
        'cta.button': 'Go to App'
      }
    };

    // FAQ Data
    const faqData = {
      de: [
        {
          q: 'Was macht dieser Konverter?',
          a: 'Der Playlist Konverter kombiniert mehrere Audio-Dateien (MP3 oder WAV) zu einer einzigen Datei. Die Tracks werden in der von dir festgelegten Reihenfolge zusammengefügt. Du kannst zwischen verschiedenen Ausgabeformaten und Qualitätsstufen wählen.'
        },
        {
          q: 'Werden meine Dateien auf einen Server hochgeladen?',
          a: 'Ja. Für die Konvertierung werden deine Dateien verschlüsselt per HTTPS auf unseren Server übertragen und dort zusammengefügt. Direkt nach dem Download – spätestens jedoch nach einer Stunde – werden sie automatisch und unwiderruflich gelöscht. Wir speichern sie nicht dauerhaft und geben sie nicht an Dritte weiter.'
        },
        {
          q: 'Welche Eingabeformate werden unterstützt?',
          a: 'Aktuell werden MP3 und WAV Dateien als Eingabeformat unterstützt. Diese sind die gängigsten Audioformate und decken die meisten Anwendungsfälle ab.'
        },
        {
          q: 'Welche Ausgabeformate sind verfügbar?',
          a: 'Du kannst zwischen drei Ausgabeformaten wählen: WebM (kompakt, modern mit Opus-Codec), MP3 (universell kompatibel) und OGG (Open Source mit Vorbis-Codec). Jedes Format hat seine Vorteile je nach Verwendungszweck.'
        },
        {
          q: 'Was bedeuten die verschiedenen Bitraten?',
          a: 'Die Bitrate bestimmt die Audioqualität und Dateigröße. Niedrig (64 kbps) eignet sich für Sprachaufnahmen, Standard (128 kbps) für normale Musik, Hoch (192 kbps) für bessere Qualität, Sehr hoch (256 kbps) für audiophile Ansprüche, und Maximum (320 kbps) für die beste verfügbare Qualität.'
        },
        {
          q: 'Wie viele Dateien kann ich gleichzeitig konvertieren?',
          a: 'Die Anzahl ist nicht begrenzt – entscheidend ist die Gesamtgröße von maximal 5 GB (höchstens 500 MB pro Datei). Die Dateien werden in der Reihenfolge zusammengefügt, die du per Drag & Drop festlegst.'
        },
        {
          q: 'Gibt es eine Größenbeschränkung?',
          a: 'Eine Playlist darf insgesamt bis zu 5 GB groß sein. Die einzelnen Dateien werden nacheinander hochgeladen und auf dem Server zusammengefügt.'
        },
        {
          q: 'Wie lange dauert die Konvertierung?',
          a: 'Die Dauer hängt von der Anzahl und Größe deiner Dateien sowie deiner Upload-Geschwindigkeit ab. Zur eigentlichen Konvertierung auf dem Server kommt die Zeit für den Upload hinzu. Kleine Playlists sind in Sekunden fertig, größere können einige Minuten dauern.'
        },
        {
          q: 'Kann ich die Reihenfolge der Tracks ändern?',
          a: 'Ja! Du kannst die Tracks per Drag & Drop in der Liste verschieben, bevor du die Konvertierung startest. Die Tracks werden dann in genau dieser Reihenfolge zusammengefügt.'
        },
        {
          q: 'Funktioniert der Konverter auf mobilen Geräten?',
          a: 'Ja, der Konverter ist vollständig responsiv und funktioniert auf Smartphones und Tablets. Beachte jedoch, dass der Upload je nach Mobilfunk- oder WLAN-Verbindung länger dauern kann.'
        },
        {
          q: 'Was ist der Unterschied zwischen den Formaten?',
          a: 'WebM mit Opus-Codec bietet die beste Kompression bei hoher Qualität und ist ideal für moderne Anwendungen. MP3 ist das universellste Format und wird von praktisch allen Geräten unterstützt. OGG mit Vorbis ist ein Open-Source-Format mit guter Qualität, das besonders in Spielen und Linux-Umgebungen beliebt ist.'
        },
        {
          q: 'Muss ich mich registrieren?',
          a: 'Nein, der Playlist Konverter ist komplett kostenlos und erfordert keine Registrierung. Du kannst sofort loslegen.'
        }
      ],
      en: [
        {
          q: 'What does this converter do?',
          a: 'The Playlist Converter combines multiple audio files (MP3 or WAV) into a single file. The tracks are merged in the order you specify. You can choose between different output formats and quality levels.'
        },
        {
          q: 'Are my files uploaded to a server?',
          a: 'Yes. For the conversion, your files are transferred to our server via encrypted HTTPS and merged there. Right after the download – at the latest after one hour – they are automatically and permanently deleted. We do not store them long-term or share them with third parties.'
        },
        {
          q: 'Which input formats are supported?',
          a: 'Currently, MP3 and WAV files are supported as input formats. These are the most common audio formats and cover most use cases.'
        },
        {
          q: 'Which output formats are available?',
          a: 'You can choose between three output formats: WebM (compact, modern with Opus codec), MP3 (universal compatibility), and OGG (open source with Vorbis codec). Each format has its advantages depending on your use case.'
        },
        {
          q: 'What do the different bitrates mean?',
          a: 'The bitrate determines audio quality and file size. Low (64 kbps) is suitable for voice recordings, Standard (128 kbps) for normal music, High (192 kbps) for better quality, Very High (256 kbps) for audiophile demands, and Maximum (320 kbps) for the best available quality.'
        },
        {
          q: 'How many files can I convert at once?',
          a: 'There is no limit on the number of files – what counts is the total size of up to 5 GB (at most 500 MB per file). The files will be merged in the order you set via drag & drop.'
        },
        {
          q: 'Is there a size limit?',
          a: 'A playlist can be up to 5 GB in total. The individual files are uploaded one after another and merged on the server.'
        },
        {
          q: 'How long does the conversion take?',
          a: 'The duration depends on the number and size of your files as well as your upload speed. In addition to the actual conversion on the server, there is the time needed to upload your files. Small playlists finish in seconds, larger ones may take a few minutes.'
        },
        {
          q: 'Can I change the order of tracks?',
          a: 'Yes! You can reorder tracks via drag & drop in the list before starting the conversion. The tracks will then be merged in exactly that order.'
        },
        {
          q: 'Does the converter work on mobile devices?',
          a: 'Yes, the converter is fully responsive and works on smartphones and tablets. However, note that the upload may take longer depending on your mobile or Wi-Fi connection.'
        },
        {
          q: 'What is the difference between the formats?',
          a: 'WebM with Opus codec offers the best compression with high quality and is ideal for modern applications. MP3 is the most universal format and is supported by virtually all devices. OGG with Vorbis is an open-source format with good quality, particularly popular in games and Linux environments.'
        },
        {
          q: 'Do I need to register?',
          a: 'No, the Playlist Converter is completely free and requires no registration. You can start right away.'
        }
      ]
    };

    // Sprache und Theme werden von der externen SSI-Navigation (nav.html) gesteuert.
    let currentLang = localStorage.getItem('locale') || 'de';

    // Theme-Mechanik wie in der App (src/stores/ui.js): html[data-theme] schaltet die
    // Tokens, body.light-theme hält Parität zum Playlist Generator, html.dark bleibt
    // als Altbestand für externe Skripte.
    function syncDarkClass() {
      const stored = document.documentElement.getAttribute('data-theme') || localStorage.getItem('theme');
      const theme = stored === 'dark' ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.body.classList.toggle('light-theme', theme === 'light');
    }

    // Language Management
    function updateLanguage(lang) {
      // Update static elements
      var elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      // SSI-Partials aktualisieren: Footer/Cookie-Banner (data-lang-*)
      // Navigation übersetzt sich selbst via applyTranslations()
      updateDataLangElements(lang);

      // Rebuild FAQ list
      renderFAQ(lang);
    }

    // data-lang-* Elemente aktualisieren (SSI-Footer/Cookie-Banner)
    function updateDataLangElements(lang) {
      var attr = 'data-lang-' + lang;
      document.querySelectorAll('[' + attr + ']').forEach(function(el) {
        el.textContent = el.getAttribute(attr);
      });
    }

    // FAQ Rendering
    function renderFAQ(lang) {
      const faqList = document.getElementById('faqList');
      const faqs = faqData[lang] || faqData.de;

      faqList.innerHTML = faqs.map((faq, index) => `
        <div class="faq-item" data-index="${index}">
          <button type="button" class="faq-question" id="faq-q-${index}" aria-expanded="false" aria-controls="faq-a-${index}" onclick="toggleFAQ(${index})">
            <span>${faq.q}</span>
            <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="faq-answer" id="faq-a-${index}" role="region" aria-labelledby="faq-q-${index}">
            <div class="faq-answer-inner">
              <div class="faq-answer-content">${faq.a}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleFAQ(index) {
      const items = document.querySelectorAll('.faq-item');
      items.forEach((item, i) => {
        const open = i === index ? !item.classList.contains('active') : false;
        item.classList.toggle('active', open);
        item.querySelector('.faq-question').setAttribute('aria-expanded', String(open));
      });
    }

    // nav.html setzt data-theme direkt, dispatcht aber KEIN Event.
    // MutationObserver erkennt Änderungen am data-theme Attribut.
    var themeObserver = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.attributeName === 'data-theme') {
          syncDarkClass();
        }
      });
    });
    themeObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme']
    });

    // nav.html dispatcht 'locale-changed' mit { detail: { locale: 'de'|'en' } }
    window.addEventListener('locale-changed', function(e) {
      var newLang = e.detail && e.detail.locale;
      if (newLang && translations[newLang]) {
        currentLang = newLang;
        document.documentElement.setAttribute('lang', newLang);
        updateLanguage(newLang);
      }
    });

    // Initialize
    syncDarkClass();
    updateLanguage(currentLang);
  </script>
</body>
</html>
