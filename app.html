<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist zu WebM Konverter</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a1324" media="(prefers-color-scheme: dark)" />
  <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
       damit Light-Nutzer keinen dunklen Flash sehen. Der UI-Store übernimmt danach. -->
  <script>
    try {
      var storedTheme = localStorage.getItem('theme')
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light')
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light')
    }
  </script>
  <link rel="stylesheet" href="/fontawesome/css/fontawesome.min.css" />
  <link rel="stylesheet" href="/fontawesome/css/solid.min.css" />
</head>
<body>
  <!--#include virtual="/partials/nav.html" -->
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <!--#include virtual="/partials/footer.html" -->
  <!--#include virtual="/partials/cookie-banner.html" -->
</body>
</html>
