<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist Konverter – Audio-Dateien zusammenfügen</title>
  <link rel="canonical" href="https://kodinitools.com/playlistkonverter/app.html">
  <link rel="alternate" hreflang="de" href="https://kodinitools.com/playlistkonverter/app.html">
  <link rel="alternate" hreflang="en" href="https://kodinitools.com/playlistkonverter/app.html?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://kodinitools.com/playlistkonverter/app.html">
  <!-- ?lang=de|en (hreflang-Ziel) hat Vorrang: vor allen Seitenskripten und der
       SSI-Navigation speichern, die die Sprache aus localStorage.locale lesen. -->
  <script>
    try {
      var urlLang = new URLSearchParams(location.search).get('lang')
      if (urlLang === 'de' || urlLang === 'en') localStorage.setItem('locale', urlLang)
    } catch (e) {}
  </script>
  <script type="module" src="/src/landing/localeHeadEntry.ts"></script>
  <meta name="description" content="Mehrere Audio-Tracks (MP3, WAV, FLAC, M4A, OGG, OPUS) zu einer Datei zusammenfügen, als MP3, WebM (Opus) oder OGG (Vorbis).">
  <meta name="theme-color" content="#eff5fc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#071321" media="(prefers-color-scheme: dark)" />
  <!-- Theme vor dem ersten Paint setzen (Tokens: Dark auf :root, Light über data-theme),
       damit Light-Nutzer keinen dunklen Flash sehen. Der UI-Store übernimmt danach. -->
  <script>
    try {
      var storedTheme = localStorage.getItem('theme')
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light')
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light')
    }
  </script>
  <link rel="stylesheet" href="/fontawesome/css/fontawesome.min.css" />
  <link rel="stylesheet" href="/fontawesome/css/solid.min.css" />
  <!-- Vorschaubild beim Teilen (1200×630) -->
  <meta property="og:image" content="https://kodinitools.com/image/kodinitools-og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kodinitools.com/image/kodinitools-og-image.jpg" />
</head>
<body>
  <!--#include virtual="/partials/nav.html" -->
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <!--#include virtual="/partials/footer.html" -->
  <!--#include virtual="/partials/cookie-banner.html" -->
</body>
</html>
